name: Build

# Gate 1: main only, and simulation only.
#
# Every cartridge-facing module has a testbench because the hardware it talks
# to cannot be put in CI: a wrong write to a cartridge is not recoverable.
# That suite is the gate here, and it runs on every push to main and every
# pull request against it. Feature branches get it from `make test` in
# seconds.
#
# Synthesis is not done here, and must not be. Quartus runs only on the
# controlled builders, sisko and kira, through the orchestrator's
# tools/runner-build, against a Quartus image that is private and stays so:
# Quartus Lite needs no licence, but that grants no right to redistribute its
# installed files, so the image is never uploaded to Actions or a registry.
# The timing gate lives there too: build.sh exits 3 on negative slack, so a
# package that ships was fit to flash where it was built. A hosted job that
# tried to synthesise here could not resolve that image and failed on every
# push, which is what this file used to do.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  sim:
    name: Simulation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the Icarus image
        run: docker build -t carttools-sim:1 -f tools/podman/Containerfile.sim tools/podman

      - name: Run the suite
        run: |
          docker run --rm -v "$PWD:/work" -w /work -e HOME=/tmp \
            carttools-sim:1 python3 tools/sim/run_all.py
