name: Release

# Gate 2: a tag, and the tag has to be on main.
#
# Both, not either. A tag alone would let a release be cut from a branch that
# never passed the main gate; main alone would publish on every merge. The
# ancestry check below is what makes "and" real - GitHub will happily run this
# for a tag pushed anywhere.
#
# This workflow does not build the bitstream, and must not. Quartus runs only
# on the controlled builders, sisko and kira, through the orchestrator's
# tools/runner-build, against a Quartus image that is private and stays so:
# Quartus Lite needs no licence, but that grants no right to redistribute its
# installed files, so the image is never uploaded to Actions or a registry.
# The timing gate lives there too: build.sh exits 3 on negative slack, so a
# package that ships was fit to flash where it was built.
#
# What CI does on a tag is check that the release the orchestrator published
# is the one the tag names: the package is present, its checksums verify, and
# the version stamped into core.json is the tag. A tag with no package, or a
# package stamped from another commit, fails here and says so.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false      # never cancel a half-checked release

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The gate. A tag is just a label and can be put on any commit, so this
      # asks git whether the tagged commit is actually reachable from main.
      - name: Require the tag to be on main
        run: |
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_REF_NAME} points at $GITHUB_SHA, which is not on main."
            echo "Tag a commit that has been merged to main and passed the Build workflow."
            exit 1
          fi
          echo "$GITHUB_REF_NAME is on main."

      - name: Simulation suite
        run: |
          docker build -t carttools-sim:1 -f tools/podman/Containerfile.sim tools/podman
          docker run --rm -v "$PWD:/work" -w /work -e HOME=/tmp \
            carttools-sim:1 python3 tools/sim/run_all.py

      # The published package, checked rather than produced. `gh` reads the
      # release; nothing here writes one.
      - name: Verify the published package
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="$GITHUB_REF_NAME"
          version="${tag#v}"
          zip="kroy.CartTools_${version}.zip"
          mkdir -p dist && cd dist
          gh release download "$tag" -p "$zip" -p SHA256SUMS -p report.txt
          sha256sum -c SHA256SUMS
          unzip -p "$zip" Cores/kroy.CartTools/core.json \
            | python3 -c "import json,sys; v=json.load(sys.stdin)['core']['metadata']['version']; print('stamped', v); sys.exit(v != '$version')"
          echo "$tag: package present, checksums verified, version stamped."
